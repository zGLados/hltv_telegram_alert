services:
  hltv-bot:
    build: .
    container_name: hltv-telegram-bot
    restart: unless-stopped

    # Environment variables from .env
    env_file:
      - .env

    # Persistent runtime data (database, match snapshot)
    volumes:
      - ./data:/app/data

    # Log rotation
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Resource limits (optional)
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
